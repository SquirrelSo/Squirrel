<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Body Tracking</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    video {
      object-fit: contain;
    }
    .mirror {
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
  <video id="v" playsinline muted autoplay></video>
  <canvas id="c"></canvas>
  <script type="module" src="/pose/tracker.js"></script>
</body>
</html>
