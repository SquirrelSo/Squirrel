  /* --heat-cell / --heat-gap drive BOTH the day cells and the month-label grid, so the
     two rows share identical column geometry and can never drift apart. The inner wrapper
     is sized to its content and centered within the (possibly scrolling) card. */
  .v2-heatgrid { --heat-cell: 13px; --heat-gap: 3px; --heat-monthsrow: 20px; overflow-x: auto; display: flex; justify-content: center; }
  .v2-heatgrid__inner { display: inline-flex; flex-direction: column; }
  /* Months on a grid with the SAME column tracks + gap as the day cells below. Each label is
     placed at gridColumnStart = the week-column its month begins in, so it lines up exactly
     above that column. Labels are wider than one cell and overflow harmlessly to the right.
     Height + line-height are pinned (rather than left to the font's natural line box) so
     --heat-monthsrow below is an exact, not approximate, match for the day-label spacer. */
  .v2-heatgrid__months { display: grid; gap: 0 var(--heat-gap); margin-bottom: 6px; height: 14px; line-height: 14px; }
  .v2-heatgrid__month { grid-row: 1; justify-self: start; font-family: var(--v2-mono); font-size: 10px; color: var(--v2-faint); white-space: nowrap; }
  .v2-heatgrid__weeks { display: flex; gap: var(--heat-gap); }
  .v2-heatgrid__col { display: flex; flex-direction: column; gap: var(--heat-gap); }
  /* day-of-week gutter, to the left of the grid. The spacer's height is --heat-monthsrow
     (the months row's own height 14px + its 6px margin-bottom, i.e. exactly how far the
     real weeks-row sits from the grid's top) MINUS one --heat-gap, because this column's
     own `gap` then re-adds that --heat-gap below the spacer — landing the first label's
     row-top at exactly --heat-monthsrow, flush with the first cell row. Every label after
     that sits `heat-cell + heat-gap` apart, identically to the real cell rows. */
  .v2-heatgrid__daylabels { display: flex; flex-direction: column; gap: var(--heat-gap); margin-right: 8px; flex: none; }
  .v2-heatgrid__dayspacer { height: calc(var(--heat-monthsrow) - var(--heat-gap)); }
  .v2-heatgrid__daylabel { height: var(--heat-cell); line-height: var(--heat-cell); font-family: var(--v2-mono); font-size: 10px; color: var(--v2-faint); text-align: right; white-space: nowrap; }
  .v2-heatcell { width: var(--heat-cell); height: var(--heat-cell); border-radius: 3px; background: var(--v2-card2); border: 1px solid var(--v2-line); }
  .v2-heatcell--active { background: #22D3EE; border-color: #22D3EE; box-shadow: 0 0 8px rgba(34,211,238,.4); }

  .v2-bmicat { display: inline-block; margin-top: 12px; font-family: var(--v2-body); font-weight: 600; font-size: 12.5px; padding: 4px 12px; border-radius: 999px; }
  .v2-bmibar { position: relative; height: 6px; border-radius: 3px; margin-top: 14px; background: linear-gradient(90deg, #56C2FF, #3ECF8E 35%, #FFB02E 70%, #E5484D); }
  .v2-bmimarker { position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%; background: #fff; border: 2px solid #101114; transform: translate(-50%,-50%); }

  /* ===== Solo Workspace — Exercise Library (V2) ===== */
  /* top-bar Home button (right slot, mirrors the pill nav) */
  .v2-hbackbtn {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--v2-line); background: none; color: var(--v2-mute); cursor: pointer;
    font-family: var(--v2-body); font-weight: 500; font-size: 13.5px; transition: background .16s, color .16s, border-color .16s;
  }
  .v2-hbackbtn:hover { background: rgba(255,255,255,.05); color: var(--v2-ink); border-color: var(--v2-line2); }
  .v2-hbackbtn svg { flex: none; }

  /* two-pane: browse (left) + sticky cart (right) */
  .v2-lib { display: grid; grid-template-columns: 1fr 440px; gap: 22px; align-items: start; }
  .v2-lib__browse { min-width: 0; }
  .v2-lib__filters { display: flex; flex-wrap: wrap; gap: 8px; }
  /* NOTE: named .v2-libchip (not .v2-chip) — .v2-chip is already defined later in this
     file for ModeSelect's static assessment tags; reusing it caused the later rule to
     override the active background, so the selected filter never turned white. */
  .v2-libchip {
    padding: 8px 15px; border-radius: 999px; border: 1px solid var(--v2-line); background: none;
    cursor: pointer; font-family: var(--v2-body); font-weight: 500; font-size: 13px; color: var(--v2-mute);
    transition: background .15s, color .15s, border-color .15s;
  }
  .v2-libchip:hover { color: var(--v2-ink); border-color: var(--v2-line2); }
  /* :hover (0,2,0) otherwise beats --active (0,1,0) and lightens the dark text on the
     gradient pill, hurting legibility while hovering an active chip. */
  .v2-libchip--active:hover { color: #06121A; }
  /* "Add all" action chip — a cyan-tinted outline so it reads as a bulk action, distinct
     from the filter pills and the gradient active-filter pill. */
  .v2-libchip--addall { display: inline-flex; align-items: center; gap: 6px; color: #22D3EE; border-color: rgba(34,211,238,.4); background: rgba(34,211,238,.08); font-weight: 600; }
  .v2-libchip--addall:hover { color: #22D3EE; border-color: rgba(34,211,238,.7); background: rgba(34,211,238,.14); }

  /* ── Library card gallery ── */
  .v2-libctl { display: flex; flex-direction: column; gap: 12px; margin-bottom: 4px; }
  .v2-libsearch { display: flex; align-items: center; gap: 10px; padding: 12px 15px; border: 1px solid var(--v2-line); border-radius: 12px; background: var(--v2-card); color: var(--v2-mute); }
  .v2-libsearch svg { flex: none; color: var(--v2-faint); }
  .v2-libsearch input { flex: 1; border: none; background: none; outline: none; color: var(--v2-ink); font-family: var(--v2-body); font-size: 14px; }
  .v2-libsearch input::placeholder { color: var(--v2-faint); }

  .v2-libsec { margin-top: 24px; }
  .v2-libsec__h { font-family: var(--v2-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--v2-mute); margin-bottom: 13px; }
  .v2-libsec__h span { color: var(--v2-faint); }
  .v2-libgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 1120px) { .v2-libgrid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 760px) { .v2-libgrid { grid-template-columns: repeat(1, 1fr); } }
  .v2-libempty { padding: 40px 4px; color: var(--v2-faint); font-family: var(--v2-body); font-size: 14px; }

  /* Photo-overlay exercise card: full-bleed image with content on a scrim. Image is
     self-hosted at public/ex-<key>.jpg (swappable); a missing image falls back to the
     brand gradient so the card still reads. */
  .v2-excard { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; border: 1px solid var(--v2-line); isolation: isolate; background: linear-gradient(155deg, #1c2530, #0f1114); transition: transform .16s, border-color .16s; animation: v2Up .4s ease both; }
  .v2-excard:hover { transform: translateY(-3px); border-color: var(--v2-line2); }
  .v2-excard--soon { opacity: .72; }
  .v2-excard__img { position: absolute; inset: 0; background-size: cover; background-position: center; filter: grayscale(.3) contrast(1.04) brightness(.94); transform: scale(1.01); transition: transform .6s ease; }
  .v2-excard:hover .v2-excard__img { transform: scale(1.06); }
  .v2-excard__scrim { position: absolute; inset: 0; background: radial-gradient(130% 78% at 50% 120%, rgba(34,211,238,.15), transparent 56%), linear-gradient(to top, rgba(8,9,11,.95) 5%, rgba(8,9,11,.5) 36%, rgba(8,9,11,.04) 64%), linear-gradient(180deg, rgba(13,14,16,.42), transparent 26%); }
  /* skill pill, top-left over the image */
  .v2-exskill { position: absolute; top: 12px; left: 12px; z-index: 3; display: inline-flex; align-items: center; gap: 7px; font-family: var(--v2-mono); font-weight: 600; font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--v2-ink); padding: 4px 9px; border-radius: 7px; background: rgba(0,0,0,.34); backdrop-filter: blur(3px); border: 1px solid rgba(255,255,255,.16); }
  .v2-exskill__dots { display: flex; gap: 3px; }
  .v2-exskill__dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.24); }
  .v2-exskill__dot--on { background: #22D3EE; box-shadow: 0 0 6px rgba(34,211,238,.7); }
  .v2-excard__body { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
  .v2-excard__meta { display: flex; flex-wrap: wrap; gap: 7px; }
  .v2-excard__name { font-family: var(--v2-disp); font-weight: 700; font-size: 20px; letter-spacing: -.02em; line-height: 1.12; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  /* the neutral body-part chip has no inline colour → glass treatment so it reads on the photo */
  .v2-excard__body .v2-typechip { color: #E7E9EC; background: rgba(255,255,255,.13); backdrop-filter: blur(3px); border-color: rgba(255,255,255,.2); }
  .v2-excard__add { display: inline-flex; align-items: center; justify-content: center; gap: 7px; margin-top: 3px; padding: 11px; border-radius: 11px; border: 1px solid rgba(255,255,255,.26); background: rgba(255,255,255,.13); backdrop-filter: blur(4px); color: #fff; font-family: var(--v2-body); font-weight: 600; font-size: 13.5px; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .v2-excard__add:hover { background: rgba(62,207,142,.22); border-color: rgba(62,207,142,.6); color: #DFF7EA; }
  .v2-excard__added { display: inline-flex; align-items: center; justify-content: center; gap: 7px; margin-top: 3px; padding: 11px; border-radius: 11px; color: #DFF7EA; font-family: var(--v2-body); font-weight: 600; font-size: 13.5px; border: 1px solid rgba(62,207,142,.55); background: rgba(62,207,142,.28); backdrop-filter: blur(4px); }
  .v2-excard__soon { text-align: center; margin-top: 3px; padding: 11px; border-radius: 11px; color: #E7E9EC; font-family: var(--v2-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; border: 1px dashed rgba(255,255,255,.3); background: rgba(0,0,0,.28); backdrop-filter: blur(3px); }

  /* ═══════ Analytics home (Level 0) — V2 ═══════ */
  .an2-head { margin-bottom: 4px; }
  .an2-kicker { font-family: var(--v2-mono); font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--v2-faint); }
  .an2-title { font-family: var(--v2-disp); font-weight: 800; font-size: clamp(26px, 3.4vw, 34px); letter-spacing: -.03em; margin: 10px 0 0; }
  .an2-sub { color: var(--v2-mute); font-size: 14px; margin: 7px 0 0; }
  .an2-msg { padding: 40px 4px; color: var(--v2-mute); font-family: var(--v2-body); }
  .an2-empty { padding: 60px 4px; }
  .an2-empty__title { font-family: var(--v2-disp); font-weight: 700; font-size: 22px; margin: 0; }
  .an2-empty__sub { color: var(--v2-mute); font-size: 14px; margin: 8px 0 0; }

  .an2-hero { display: grid; grid-template-columns: 250px 1fr; gap: 20px; margin-top: 22px; border: 1px solid var(--v2-line); border-radius: 18px; background: var(--v2-card); overflow: hidden; animation: v2Up .5s ease both; }
  .an2-hero__l { padding: 22px 24px; border-right: 1px solid var(--v2-line); display: flex; flex-direction: column; justify-content: center; }
  .an2-hero__cap { font-family: var(--v2-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--v2-mute); }
  .an2-hero__num { font-family: var(--v2-mono); font-weight: 600; font-size: 64px; line-height: .9; margin-top: 14px; letter-spacing: -.02em; }
  .an2-hero__sub { font-size: 12.5px; color: var(--v2-faint); margin-top: 8px; }
  .an2-trendchip { display: inline-flex; align-items: center; gap: 7px; margin-top: 16px; align-self: flex-start; font-family: var(--v2-mono); font-size: 11px; padding: 6px 11px; border-radius: 999px; }
  .an2-trendchip.up { color: var(--v2-green); background: rgba(62,207,142,.1); border: 1px solid rgba(62,207,142,.32); }
  .an2-trendchip.down { color: var(--v2-red); background: rgba(229,72,77,.1); border: 1px solid rgba(229,72,77,.32); }
  .an2-hero__r { padding: 16px 20px 12px; min-width: 0; }
  .an2-hero__rh { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .an2-hero__rh b { font-family: var(--v2-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--v2-mute); font-weight: 500; }
  .an2-hero__rh span { font-size: 11.5px; color: var(--v2-faint); }
  @media (max-width: 760px) { .an2-hero { grid-template-columns: 1fr; } .an2-hero__l { border-right: none; border-bottom: 1px solid var(--v2-line); } }

  .an2-kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 14px; }
  @media (max-width: 820px) { .an2-kpis { grid-template-columns: repeat(2, 1fr); } }
  .an2-kpi { border: 1px solid var(--v2-line); border-radius: 14px; background: var(--v2-card); padding: 15px 16px; }
  .an2-kpi__l { font-family: var(--v2-mono); font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--v2-mute); }
  .an2-kpi__v { display: block; font-family: var(--v2-mono); font-weight: 600; font-size: 26px; line-height: 1; margin-top: 11px; }
  .an2-kpi__s { display: block; font-size: 11px; color: var(--v2-faint); margin-top: 7px; }
  .an2-kpi__s .up { color: var(--v2-green); } .an2-kpi__s .down { color: var(--v2-red); }

  .an2-sec { font-family: var(--v2-mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--v2-mute); margin: 28px 0 13px; }
  .an2-coach { border: 1px solid var(--v2-line); border-radius: 16px; background: linear-gradient(100deg, rgba(34,211,238,.07), transparent 60%), var(--v2-card); padding: 20px 22px; }
  .an2-coach ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 11px; }
  .an2-coach li { display: flex; gap: 11px; font-size: 13.5px; color: var(--v2-ink); line-height: 1.5; }
  .an2-coach li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: linear-gradient(120deg, #3B82F6, #22D3EE); }

  .an2-daygroup { margin-bottom: 15px; }
  .an2-dayhdr { display: flex; align-items: center; gap: 11px; font-family: var(--v2-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--v2-faint); margin: 0 2px 9px; }
  .an2-daycount { color: #22D3EE; font-size: 9.5px; letter-spacing: .1em; padding: 3px 8px; border: 1px solid rgba(34,211,238,.32); border-radius: 999px; }
  .an2-hist { display: flex; flex-direction: column; gap: 8px; }
  .an2-hrow { display: grid; grid-template-columns: 46px 1fr auto 18px; align-items: center; gap: 14px; width: 100%; padding: 12px 15px; border: 1px solid var(--v2-line); border-radius: 13px; background: var(--v2-card); cursor: pointer; text-align: left; transition: background .15s, border-color .15s; }
  .an2-hrow:hover { border-color: var(--v2-line2); background: var(--v2-card2); }
  .an2-hrow__score { display: flex; }
  .an2-hrow__id b { font-size: 14.5px; font-weight: 600; color: var(--v2-ink); }
  .an2-hrow__id span { display: block; font-size: 12px; color: var(--v2-mute); margin-top: 2px; }
  .an2-hrow__m { font-family: var(--v2-mono); font-size: 12.5px; color: var(--v2-mute); }
  .an2-hrow__chev { color: var(--v2-faint); display: flex; }
  .an2-dash { font-family: var(--v2-mono); color: var(--v2-faint); font-size: 16px; display: grid; place-items: center; width: 46px; height: 46px; }

  /* ═══════ Session overview (Level 1) — V2 ═══════ */
  .an2-detailhead { margin-bottom: 4px; }
  .an2-back { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; padding: 0; font-family: var(--v2-mono); font-size: 12px; letter-spacing: .04em; color: var(--v2-mute); margin-bottom: 12px; transition: color .15s; }
  .an2-back:hover { color: var(--v2-ink); }
  .an2-back svg { flex: none; }
  .an2-shero { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; border: 1px solid var(--v2-line); border-radius: 18px; background: var(--v2-card); padding: 22px 24px; margin-top: 16px; animation: v2Up .5s ease both; }
  .an2-chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .an2-chip { border: 1px solid var(--v2-line); border-radius: 12px; background: var(--v2-card2); padding: 11px 15px; min-width: 84px; }
  .an2-chip b { display: block; font-family: var(--v2-mono); font-weight: 600; font-size: 20px; }
  .an2-chip s { font-family: var(--v2-mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--v2-mute); text-decoration: none; }
  @media (max-width: 560px) { .an2-shero { grid-template-columns: 1fr; justify-items: center; text-align: center; } }

  .an2-exrow { display: grid; grid-template-columns: 44px 1fr auto auto 46px 18px; align-items: center; gap: 15px; width: 100%; padding: 14px 16px; border: 1px solid var(--v2-line); border-radius: 14px; background: var(--v2-card); cursor: pointer; text-align: left; transition: background .15s, border-color .15s; }
  .an2-exrow:hover:not(:disabled) { border-color: var(--v2-line2); background: var(--v2-card2); }
  .an2-exrow:disabled { cursor: default; opacity: .6; }
  .an2-exrow__icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; border: 1px solid; }
  .an2-exrow__id b { font-size: 15px; font-weight: 600; color: var(--v2-ink); }
  .an2-exrow__tags { display: flex; gap: 7px; margin-top: 5px; }
  .an2-tag { font-family: var(--v2-mono); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--v2-line); color: var(--v2-mute); white-space: nowrap; }
  .an2-qbar { width: 96px; }
  .an2-exrow__nodata { font-family: var(--v2-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--v2-faint); }
  .an2-exrow__met { text-align: right; }
  .an2-exrow__met b { font-family: var(--v2-mono); font-size: 15px; font-weight: 600; color: var(--v2-ink); }
  .an2-exrow__met s { display: block; font-family: var(--v2-mono); font-size: 10px; color: var(--v2-faint); text-decoration: none; margin-top: 2px; }
  .an2-exrow__score { display: flex; }
  .an2-exrow__chev { color: var(--v2-faint); display: flex; }
  @media (max-width: 680px) { .an2-exrow { grid-template-columns: 44px 1fr auto 46px 18px; } .an2-qbar { display: none; } }
  /* active filter = blue→cyan gradient pill with dark text */
  .v2-libchip--active { background: linear-gradient(120deg, #3B82F6, #22D3EE); color: #06121A; border-color: transparent; font-weight: 600; box-shadow: 0 4px 14px rgba(34,211,238,.22); }

  .v2-lib__cats { display: flex; flex-direction: column; gap: 12px; }
  .v2-cat { border: 1px solid var(--v2-line); border-radius: 15px; background: var(--v2-card); overflow: hidden; animation: v2Up .5s ease both; }
  .v2-cat__head { display: flex; align-items: center; gap: 14px; width: 100%; padding: 15px 18px; border: none; background: none; cursor: pointer; text-align: left; transition: background .15s; }
  .v2-cat__head:hover { background: rgba(255,255,255,.03); }
  .v2-cat__icon { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; flex: none; color: var(--v2-mute); background: var(--v2-card2); border: 1px solid var(--v2-line); }
  .v2-cat__name { font-family: var(--v2-body); font-weight: 600; font-size: 16px; flex: 1; color: var(--v2-ink); }
  .v2-cat__meta { font-family: var(--v2-mono); font-size: 11px; color: var(--v2-faint); margin-right: 6px; }
  .v2-cat__chev { color: var(--v2-mute); transition: transform .22s; flex: none; }
  .v2-cat__chev--open { transform: rotate(180deg); }
  .v2-cat__body { padding: 2px 12px 12px; display: flex; flex-direction: column; gap: 6px; }

  .v2-ex { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 13px; border-radius: 11px; background: var(--v2-card2); }
  .v2-ex__l { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .v2-ex__name { font-family: var(--v2-body); font-weight: 600; font-size: 14.5px; color: var(--v2-ink); }
  .v2-ex--soon .v2-ex__name { color: var(--v2-mute); }
  .v2-typechip { font-family: var(--v2-mono); font-weight: 500; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; border: 1px solid var(--v2-line); color: var(--v2-mute); white-space: nowrap; }
  .v2-ex__add { display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 9px; border: 1px solid var(--v2-line2); background: none; cursor: pointer; font-family: var(--v2-body); font-weight: 600; font-size: 13px; color: var(--v2-ink); transition: background .15s, border-color .15s; flex: none; }
  .v2-ex__add:hover { background: rgba(255,255,255,.06); }
  .v2-ex__added { display: flex; align-items: center; gap: 6px; font-family: var(--v2-body); font-weight: 600; font-size: 13px; color: var(--v2-green); flex: none; }
  /* the "Soon" pill reuses the global .v2-pill / .v2-pill--soon (amber) defined below */
  .v2-ex .v2-pill { flex: none; }

  /* Your Workout cart */
  .v2-cart { position: sticky; top: 0; display: flex; flex-direction: column; max-height: calc(100vh - 190px); border: 1px solid var(--v2-line); border-radius: 15px; background: var(--v2-card); overflow: hidden; animation: v2Up .5s ease both; }
  .v2-cart__head { padding: 17px 20px 14px; border-bottom: 1px solid var(--v2-line); display: flex; align-items: center; justify-content: space-between; }
  .v2-cart__count { font-family: var(--v2-mono); font-weight: 600; font-size: 12px; color: #22D3EE; }
  .v2-cart__list { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .v2-cart__empty { margin: auto; text-align: center; color: var(--v2-faint); font-family: var(--v2-body); font-size: 13.5px; line-height: 1.5; padding: 30px 12px; }
  .v2-cartitem { border: 1px solid var(--v2-line); border-radius: 12px; background: var(--v2-card2); padding: 12px 14px; animation: v2Up .3s ease both; }
  .v2-cartitem__top { display: flex; align-items: center; justify-content: space-between; }
  .v2-cartitem__name { font-family: var(--v2-body); font-weight: 600; font-size: 14px; color: var(--v2-ink); }
  .v2-cartitem__rm { background: none; border: none; cursor: pointer; color: var(--v2-faint); padding: 3px; border-radius: 7px; display: grid; place-items: center; transition: background .15s, color .15s; }
  .v2-cartitem__rm:hover { color: var(--v2-red); background: rgba(229,72,77,.12); }
  .v2-cartitem__cfg { display: flex; flex-wrap: wrap; gap: 10px 12px; margin-top: 11px; }
  .v2-cartitem__field { display: flex; flex-direction: column; gap: 6px; }
  .v2-fieldlabel { font-family: var(--v2-mono); font-weight: 500; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--v2-faint); }
  .v2-cart__foot { padding: 16px 18px; border-top: 1px solid var(--v2-line); }
  .v2-cart__error { margin-bottom: 10px; padding: 9px 11px; border: 1px solid rgba(229,72,77,.32); border-radius: 9px; background: rgba(229,72,77,.09); color: #F3A6A9; font-family: var(--v2-body); font-size: 12px; line-height: 1.4; }
  .v2-cart__error b { color: #FFD1D3; font-weight: 650; }
  .v2-cart__summary { font-family: var(--v2-body); font-size: 13px; color: var(--v2-mute); margin-bottom: 12px; }
  .v2-cart__summary b { color: var(--v2-ink); font-weight: 600; }

  /* ── Training-program redesign: goal picker, program bar, recommended plan, adaptive cart ── */
  /* Goal picker: a vertical stack of program cards on the left, a concept photo panel on the
     right (same layered photo+scrim pattern as the ModeSelect training panel). */
  .v2-goals { display: grid; grid-template-columns: 1fr 400px; gap: 24px; align-items: start; animation: v2Up .5s ease both; }
  .v2-goals__main { min-width: 0; }
  .v2-goalstack { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .v2-goalcard { --gc: var(--v2-mute); text-align: left; cursor: pointer; display: flex; align-items: center; gap: 18px; padding: 20px 22px; border-radius: 16px; border: 1px solid var(--v2-line); background: var(--v2-card); transition: transform .16s, border-color .16s, background .16s; animation: v2Up .4s ease both; }
  .v2-goalcard:hover { transform: translateX(3px); border-color: color-mix(in srgb, var(--gc) 55%, transparent); background: var(--v2-card2); }
  .v2-goalcard__icon { width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; flex: none; color: var(--gc); background: color-mix(in srgb, var(--gc) 16%, transparent); border: 1px solid color-mix(in srgb, var(--gc) 40%, transparent); }
  .v2-goalcard__body { flex: 1; min-width: 0; }
  .v2-goalcard__name { font-family: var(--v2-disp); font-weight: 700; font-size: 19px; letter-spacing: -.02em; color: var(--v2-ink); }
  .v2-goalcard__tag { font-family: var(--v2-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gc); margin-top: 3px; }
  .v2-goalcard__blurb { font-family: var(--v2-body); font-size: 12.5px; line-height: 1.45; color: var(--v2-mute); margin-top: 7px; }
  .v2-goalcard__arrow { flex: none; color: var(--v2-faint); transition: transform .16s, color .16s; }
  .v2-goalcard:hover .v2-goalcard__arrow { color: var(--gc); transform: translateX(3px); }

  .v2-goalpanel { position: relative; overflow: hidden; border-radius: 20px; height: calc(100vh - 190px); min-height: 480px; border: 1px solid var(--v2-line); display: flex; flex-direction: column; justify-content: flex-end; padding: 32px; animation: v2Up .5s ease both; }
  .v2-goalpanel__photo { position: absolute; inset: 0; z-index: 0; background: url('/programs-panel.jpg') center 42% / cover no-repeat, linear-gradient(160deg, #1c1f27, #0d0e10); }
  .v2-goalpanel__scrim { position: absolute; left: 0; right: 0; top: 0; bottom: -1px; z-index: 1; background: linear-gradient(180deg, rgba(13,14,16,.12) 0%, rgba(13,14,16,.5) 50%, rgba(13,14,16,.92) 84%, #0D0E10 100%); }
  .v2-goalpanel__eyebrow { position: relative; z-index: 2; display: inline-block; font-family: var(--v2-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; background: linear-gradient(120deg, #3B82F6, #22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0 0 10px; }
  .v2-goalpanel__title { position: relative; z-index: 2; font-family: var(--v2-disp); font-weight: 700; font-size: 26px; letter-spacing: -.02em; color: var(--v2-ink); line-height: 1.12; margin: 0; }
  .v2-goalpanel__desc { position: relative; z-index: 2; font-family: var(--v2-body); font-size: 13.5px; color: var(--v2-mute); line-height: 1.55; max-width: 320px; margin: 12px 0 0; }

  .v2-progbar { display: flex; align-items: center; gap: 15px; padding: 15px 18px; border-radius: 15px; border: 1px solid var(--v2-line); background: var(--v2-card); margin-bottom: 18px; animation: v2Up .4s ease both; }
  .v2-progbar__icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex: none; border: 1px solid; }
  .v2-progbar__info { min-width: 0; flex: 1; }
  .v2-progbar__name { font-family: var(--v2-disp); font-weight: 700; font-size: 18px; letter-spacing: -.02em; color: var(--v2-ink); }
  .v2-progbar__blurb { font-family: var(--v2-body); font-size: 12.5px; color: var(--v2-mute); margin-top: 2px; }
  .v2-progbar__change { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 8px 13px; border-radius: 10px; border: 1px solid var(--v2-line2); background: none; cursor: pointer; font-family: var(--v2-body); font-weight: 600; font-size: 12.5px; color: var(--v2-mute); transition: color .15s, border-color .15s; }
  .v2-progbar__change:hover { color: var(--v2-ink); border-color: var(--v2-ink); }

  .v2-reco { border: 1px solid var(--v2-line); border-radius: 15px; background: var(--v2-card); padding: 16px 18px; margin-bottom: 20px; animation: v2Up .4s ease both; }
  .v2-reco__head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 13px; }
  .v2-reco__title { font-family: var(--v2-disp); font-weight: 700; font-size: 15.5px; letter-spacing: -.01em; color: var(--v2-ink); }
  .v2-reco__sub { font-family: var(--v2-body); font-size: 12.5px; color: var(--v2-mute); margin-top: 2px; }
  .v2-reco__use { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 9px 15px; border-radius: 11px; border: none; cursor: pointer; font-family: var(--v2-body); font-weight: 600; font-size: 13px; color: #06121A; background: linear-gradient(120deg, #3B82F6, #22D3EE); box-shadow: 0 4px 14px rgba(34,211,238,.22); }
  .v2-reco__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .v2-reco__item { display: flex; align-items: center; gap: 11px; }
  .v2-reco__num { flex: none; width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-family: var(--v2-mono); font-size: 11px; font-weight: 600; color: #06121A; background: linear-gradient(120deg, #3B82F6, #22D3EE); }
  .v2-reco__name { flex: 1; font-family: var(--v2-body); font-weight: 600; font-size: 13.5px; color: var(--v2-ink); }
  .v2-reco__item--soon .v2-reco__num { color: var(--v2-faint); background: var(--v2-card2); border: 1px solid var(--v2-line); }
  .v2-reco__item--soon .v2-reco__name { color: var(--v2-faint); }
  .v2-reco__soontag { font-family: var(--v2-mono); font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--v2-faint); border: 1px dashed var(--v2-line2); border-radius: 6px; padding: 2px 6px; }

  .v2-cart__struct { font-family: var(--v2-mono); font-weight: 500; font-size: 10.5px; color: var(--v2-mute); text-align: right; }
  .v2-cartcfg { display: flex; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--v2-line); }
  .v2-cartcfg__field { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .v2-cartitem__ord { flex: none; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-family: var(--v2-mono); font-size: 10.5px; font-weight: 600; color: #06121A; background: linear-gradient(120deg, #3B82F6, #22D3EE); margin-right: 9px; }
  .v2-cartitem__name { flex: 1; }
  .v2-cartitem__tools { display: flex; align-items: center; gap: 2px; }
  .v2-cartitem__mv { background: none; border: none; cursor: pointer; color: var(--v2-faint); padding: 3px; border-radius: 6px; display: grid; place-items: center; transition: background .15s, color .15s; }
  .v2-cartitem__mv:hover:not(:disabled) { color: var(--v2-ink); background: rgba(255,255,255,.07); }
  .v2-cartitem__mv:disabled { opacity: .3; cursor: default; }
  .v2-cartitem__interval { margin-top: 10px; font-family: var(--v2-mono); font-size: 11px; letter-spacing: .04em; color: var(--v2-mute); }
  .v2-excard__note { font-family: var(--v2-body); font-size: 11.5px; line-height: 1.4; color: #E0B341; background: rgba(224,179,65,.1); border: 1px solid rgba(224,179,65,.25); border-radius: 9px; padding: 7px 10px; }

  /* numeric stepper */
  .v2-step { display: inline-flex; align-items: center; border: 1px solid var(--v2-line); border-radius: 9px; overflow: hidden; background: var(--v2-bg); }
  .v2-step__btn { width: 28px; height: 32px; background: none; border: none; cursor: pointer; color: var(--v2-mute); font-family: var(--v2-body); font-size: 16px; line-height: 1; transition: background .15s, color .15s; }
  .v2-step__btn:hover:not(:disabled) { background: rgba(255,255,255,.06); color: var(--v2-ink); }
  .v2-step__btn:disabled { opacity: .35; cursor: default; }
  .v2-step__val { width: 40px; text-align: center; font-family: var(--v2-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--v2-ink); }

  /* calibration-needed modal */
  .v2-modalscrim { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(0,0,0,.6); animation: fadeIn .25s ease both; }
  .v2-modal { width: 380px; max-width: calc(100vw - 40px); padding: 30px 28px; border-radius: 18px; background: var(--v2-card); border: 1px solid var(--v2-line); text-align: center; animation: v2Up .3s ease both; }
  .v2-modal__icon { display: inline-grid; place-items: center; width: 58px; height: 58px; border-radius: 15px; color: var(--v2-mute); background: var(--v2-card2); border: 1px solid var(--v2-line); margin-bottom: 18px; }
  .v2-modal__title { font-family: var(--v2-disp); font-weight: 700; font-size: 26px; line-height: 1; margin: 0; color: var(--v2-ink); }
  .v2-modal__desc { font-family: var(--v2-body); font-size: 14px; color: var(--v2-mute); line-height: 1.55; margin: 12px 0 0; }
  .v2-modal__actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }

  /* skill segmented control */
  .v2-skillhead { display: flex; align-items: center; justify-content: space-between; }
  /* segmented skill toggle — styled to match the Home/Training pill nav (.v2-hnavitem):
     full-round pills on a dark inset track; solid white active pill with dark text. */
  .v2-seg { display: flex; width: 100%; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(0,0,0,.25); margin-top: 14px; }
  .v2-seg__opt { flex: 1; padding: 9px 6px; text-align: center; border-radius: 999px; border: none; background: none; cursor: pointer; font-family: var(--v2-body); font-weight: 500; font-size: 13px; color: var(--v2-mute); transition: background .16s, color .16s; }
  .v2-seg__opt:not(.v2-seg__opt--active):hover { background: rgba(255,255,255,.14); color: var(--v2-ink); }
  .v2-seg__opt--active { color: #0D0E10; background: var(--v2-ink); font-weight: 600; }
  .v2-skilldesc { font-size: 13px; color: var(--v2-mute); line-height: 1.5; margin: 14px 0 0; }
  .v2-skillupdate {
    font-family: var(--v2-body); font-weight: 600; font-size: 12px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    color: var(--v2-ink); background: rgba(255,255,255,.06); border: 1px solid var(--v2-line2); transition: background .15s;
  }
  .v2-skillupdate:hover:not(:disabled) { background: rgba(255,255,255,.12); }
  .v2-skillupdate:disabled { cursor: default; opacity: .8; }
  .v2-skilldone {
    font-family: var(--v2-mono); font-weight: 600; font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px; color: var(--v2-green); background: rgba(62,207,142,.08); border: 1px solid rgba(62,207,142,.4);
  }

  .v2-schedlist { margin-top: 10px; }
  .v2-schedrow { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--v2-line); }
  .v2-schedrow:last-child { border-bottom: none; padding-bottom: 0; }
  .v2-schedtime { font-family: var(--v2-mono); font-weight: 600; font-size: 15px; color: var(--v2-ink); width: 54px; flex: none; }
  .v2-schedname { font-family: var(--v2-body); font-weight: 600; font-size: 14.5px; color: var(--v2-ink); }
  .v2-schedmeta { font-size: 12px; color: var(--v2-mute); margin-top: 2px; }
  .v2-scheddur { margin-left: auto; font-size: 11.5px; color: var(--v2-faint); }

  /* assessment banner */
  /* Required assessment tile — blue→cyan gradient identity, amber "Required" flag.
     Blue-tinted border + faint ring make it read as the priority action on Home. */
  .v2-assess { display: flex; align-items: center; gap: 26px; padding: 22px 26px; border-radius: 16px; margin-bottom: 20px;
    background: linear-gradient(100deg, rgba(59,130,246,.15), transparent 60%), var(--v2-card);
    border: 1px solid rgba(59,130,246,.34); box-shadow: 0 0 0 1px rgba(59,130,246,.08); animation: v2Up .5s ease both; }
  .v2-assess__body { flex: 1; min-width: 0; }
  .v2-assess__badges { display: flex; align-items: center; gap: 12px; margin-bottom: 11px; }
  .v2-reqpill { display: inline-flex; align-items: center; gap: 7px; font-family: var(--v2-mono); font-weight: 600;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px;
    color: #FFCF70; background: rgba(255,178,46,.13); border: 1px solid rgba(255,178,46,.42); }
  .v2-reqpill__dot { width: 6px; height: 6px; border-radius: 50%; background: #FFB02E; box-shadow: 0 0 8px rgba(255,176,46,.85); }
  .v2-assess__meta { font-family: var(--v2-mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--v2-faint); }
  .v2-assess__title { font-family: var(--v2-disp); font-weight: 700; font-size: 25px; letter-spacing: -.02em; margin: 0; }
  .v2-assess__desc { font-size: 13.5px; color: var(--v2-mute); line-height: 1.5; margin: 8px 0 0; max-width: 640px; }
  .v2-assess__chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .v2-assess__cta { flex: none; display: inline-flex; align-items: center; gap: 9px; padding: 14px 24px; border: none; cursor: pointer;
    border-radius: 999px; font-family: var(--v2-body); font-weight: 600; font-size: 15px; letter-spacing: -.01em; color: #0D0E10;
    background: linear-gradient(120deg, #3B82F6, #22D3EE); box-shadow: 0 10px 28px -10px rgba(59,130,246,.6);
    transition: transform .18s, box-shadow .18s, filter .18s; }
  .v2-assess__cta:hover { transform: translateY(-2px); filter: brightness(1.05); box-shadow: 0 16px 38px -10px rgba(34,211,238,.55); }
  .v2-assess__cta:focus-visible { outline: 2px solid #22D3EE; outline-offset: 3px; }
  .v2-assess__cta svg { flex: none; }
  @media (max-width: 720px) { .v2-assess { flex-direction: column; align-items: flex-start; gap: 18px; } .v2-assess__cta { width: 100%; justify-content: center; } }

  .v2-pill { font-family: var(--v2-mono); font-weight: 600; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 5px 11px; border-radius: 999px; }
  .v2-pill--live { color: var(--v2-green); background: rgba(62,207,142,.1); border: 1px solid rgba(62,207,142,.4); }
  .v2-pill--soon { color: #FFB02E; background: rgba(255,176,46,.1); border: 1px solid rgba(255,176,46,.38); }

  /* ===== Partner Hunt (ModeSelect → Partner Hunt tab) ===== */
  .v2-ph { max-width: 980px; }
  .v2-ph__muted { font-size: 13px; line-height: 1.55; color: var(--v2-mute); margin: 0; }
  .v2-ph__hint { font-size: 11.5px; color: var(--v2-faint); margin-top: 6px; line-height: 1.45; }
  .v2-ph__panel, .v2-ph__gate, .v2-ph__form { gap: 12px; margin-bottom: 16px; }
  .v2-ph__panel--amber { border-color: rgba(255,176,46,.38); }
  .v2-ph__panel--red { border-color: rgba(229,72,77,.45); }
  .v2-ph__paneltitle { font-family: var(--v2-disp); font-weight: 700; font-size: 19px; letter-spacing: -.01em; color: var(--v2-ink); }
  .v2-ph__xp { display: flex; align-items: baseline; gap: 8px; }
  .v2-ph__xpnum { font-family: var(--v2-disp); font-weight: 700; font-size: 44px; line-height: 1; color: var(--v2-ink); font-variant-numeric: tabular-nums; }
  .v2-ph__xpof { font-family: var(--v2-mono); font-size: 13px; color: var(--v2-mute); }
  .v2-ph__bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); overflow: hidden; }
  .v2-ph__barfill { height: 100%; border-radius: 999px; background: var(--v2-green); transition: width .4s ease; }
  .v2-ph__field { gap: 2px; }
  .v2-ph__chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .v2-ph__toggle { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--v2-ink); cursor: pointer; }
  .v2-ph__toggle input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--v2-green); }

  /* Sign-up page 2 (ProfileDetails.tsx) — reuses page 1's sections and Partner Hunt's chips/toggle. */
  .v2-pd__stack { display: flex; flex-direction: column; gap: 16px; }
  .v2-pd__note { color: var(--v2-mute); }
  .v2-ph__ages { display: flex; align-items: center; gap: 10px; }
  .v2-ph__ages .v2-input { width: 96px; }
  .v2-ph__actions { display: flex; justify-content: flex-end; gap: 10px; }
  .v2-ph__barrow { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .v2-ph__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .v2-ph__card { gap: 12px; }
  .v2-ph__cardtop { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .v2-ph__name { font-family: var(--v2-disp); font-weight: 700; font-size: 18px; color: var(--v2-ink); }
  .v2-ph__score { flex: none; font-family: var(--v2-mono); font-weight: 600; font-size: 11px; color: var(--v2-green); background: rgba(62,207,142,.1); border: 1px solid rgba(62,207,142,.4); padding: 5px 10px; border-radius: 999px; }
  .v2-ph__reasons { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.6; color: var(--v2-ink); }
  .v2-ph__cardfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 4px; }
  .v2-ph__linkbtn { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; padding: 4px 0; cursor: pointer; font-family: var(--v2-body); font-size: 12.5px; color: var(--v2-mute); }
  .v2-ph__linkbtn:hover { color: var(--v2-red); }
  .v2-ph__confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12.5px; color: var(--v2-ink); }
  .v2-ph__danger { background: var(--v2-red); color: #fff; }
  @media (max-width: 640px) {
    .v2-ph__barrow { flex-direction: column; align-items: flex-start; }
    .v2-ph__xpnum { font-size: 36px; }
  }
  .v2-chip { font-family: var(--v2-body); font-weight: 500; font-size: 11.5px; color: var(--v2-mute); padding: 5px 11px; border-radius: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--v2-line); }

  /* training mode: split panel (left) + stacked cards (right) */
  .v2-trainwrap { display: grid; grid-template-columns: 0.85fr 1.15fr; gap: 20px; align-items: stretch; }

  .v2-trainpanel {
    position: relative; overflow: hidden; min-height: 360px; border-radius: 18px; padding: 26px;
    display: flex; flex-direction: column; justify-content: flex-end;
    background: var(--v2-bg);
    border: 1px solid var(--v2-line); animation: v2Up .5s ease both;
  }
  /* Photo + scrim are separate stacked layers (not a multi-value `background`
     shorthand) — a single element painting a gradient ON TOP OF an image can
     leave a 1px subpixel seam at the clipped rounded bottom edge where the
     cover-sized image pokes out below the opaque gradient stop. As sibling
     layers both `inset:0`, they clip identically and the scrim fully covers the
     photo at every row. The scrim is oversized 1px past the bottom so its
     opaque end never anti-aliases short of the clip edge. */
  .v2-trainpanel__photo {
    position: absolute; inset: 0; z-index: 0;
    background: url('/training-panel.jpg') center 50% / cover no-repeat;
  }
  .v2-trainpanel__scrim {
    position: absolute; left: 0; right: 0; top: 0; bottom: -1px; z-index: 1;
    background: linear-gradient(180deg, rgba(13,14,16,.1) 0%, rgba(13,14,16,.42) 55%, rgba(13,14,16,.94) 82%, #0D0E10 100%);
  }
  .v2-trainpanel > .v2-trainpanel__eyebrow,
  .v2-trainpanel > .v2-trainpanel__title,
  .v2-trainpanel > .v2-trainpanel__desc { z-index: 2; }
  .v2-trainpanel__eyebrow { position: relative; display: inline-block; font-family: var(--v2-mono); font-weight: 500; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; background: linear-gradient(120deg, #3B82F6, #22D3EE); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0 0 10px; }
  .v2-trainpanel__title { position: relative; font-family: var(--v2-disp); font-weight: 700; font-size: 25px; letter-spacing: -.01em; color: var(--v2-ink); margin: 0; }
  .v2-trainpanel__desc { position: relative; font-size: 13px; color: var(--v2-mute); line-height: 1.55; max-width: 300px; margin: 10px 0 0; }

  .v2-traincards { display: flex; flex-direction: column; gap: 12px; }

  .v2-modecard {
    text-align: left; display: flex; flex-direction: column; padding: 24px; border-radius: 17px;
    background: var(--v2-card); border: 1px solid var(--v2-line); animation: v2Up .5s ease both;
    transition: transform .16s, border-color .18s, background .18s;
  }
  .v2-modecard--live { cursor: pointer; }
  .v2-modecard--live:hover { transform: translateY(-3px); border-color: var(--v2-line2); background: var(--v2-card2); }
  .v2-modecard--soon { opacity: .6; }
  .v2-modecard--hero { background: var(--v2-card2); border-color: var(--v2-line2); padding: 28px 30px; }
  .v2-modecard--hero .v2-modecard__icon { width: 56px; height: 56px; }
  .v2-modecard--hero .v2-modecard__title { font-size: 22px; margin-top: 16px; }
  .v2-modecard--hero .v2-modecard__desc { font-size: 14px; max-width: 420px; }
  .v2-modecard__top { display: flex; align-items: center; justify-content: space-between; }
  .v2-modecard__icon { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 13px; background: var(--v2-card2); border: 1px solid var(--v2-line2); flex: none; }
  .v2-modecard__title { font-family: var(--v2-body); font-weight: 600; font-size: 19px; margin: 18px 0 0; color: var(--v2-ink); }
  .v2-modecard__desc { font-size: 13.5px; color: var(--v2-mute); margin: 8px 0 0; line-height: 1.5; }
  .v2-modecard__foot { margin-top: auto; padding-top: 16px; font-family: var(--v2-body); font-weight: 600; font-size: 13px; color: var(--v2-ink); display: flex; align-items: center; gap: 7px; }
  .v2-modecard__arrow { transition: transform .18s; }
  .v2-modecard--live:hover .v2-modecard__arrow { transform: translateX(4px); }

  /* compact "soon" row variant, used for Group Class / 1:1 Coaching under the hero card */
  .v2-modecard--row { flex-direction: row; align-items: center; gap: 16px; padding: 18px 20px; }
  .v2-modecard--row .v2-modecard__icon { width: 42px; height: 42px; }
  .v2-modecard__body { flex: 1; min-width: 0; }
  .v2-modecard--row .v2-modecard__title { margin: 0 0 3px; font-size: 14.5px; }

  @media (max-width: 780px) {
    .v2-trainwrap { grid-template-columns: 1fr; }

  }

  /* ===== V2 live coach — edge-to-edge camera with quiet instrument chrome ===== */
  .stage--immersive { padding: 0; }
  .stage--immersive .board-scale { flex: none; }
  .stage--immersive .board {
    border-radius: 0;
    box-shadow: none;
  }

  .coach-v2 {
    --ui: var(--v2-body);

  .coach-setup-screen, .coach-live-screen { position: absolute; inset: 0; overflow: hidden; }

    background:
      linear-gradient(90deg, rgba(5,6,7,.22), transparent 18%, transparent 62%, rgba(5,6,7,.88) 100%),
      linear-gradient(180deg, rgba(5,6,7,.34), transparent 18%, transparent 78%, rgba(5,6,7,.25));

  .coach-guide {

  .coach-guide__progress { width: 100%; height: 3px; overflow: hidden; background: rgba(255,255,255,.16); }

  /* ===== F5 · Set recap (verdict-first summary) ===== */
  .coach-recap {
    position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden; z-index: 50;
    font-family: var(--ui); color: var(--q-neutral);
    background:
      radial-gradient(120% 80% at 50% -8%, #0C1120 0%, transparent 55%),
      radial-gradient(90% 60% at 92% 108%, rgba(91,124,255,.10) 0%, transparent 60%),
      var(--bg);

  .coach-recap__page { max-width: 880px; margin: 0 auto; }
  .coach-recap__label {
    font-family: var(--v2-mono); font-size: 11px; font-weight: 600;
    letter-spacing: .20em; text-transform: uppercase; color: var(--ink-faint);
  }
  .coach-recap__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: clamp(30px, 5vw, 52px); }
  .coach-recap__eyebrow {
    display: inline-flex; align-items: center; gap: 10px; font-family: var(--v2-mono);
    font-size: 12px; font-weight: 600; letter-spacing: .22em; text-transform: uppercase; color: var(--ink-dim);
  }
  .coach-recap__eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: var(--q-green); box-shadow: 0 0 12px var(--q-green); }
  .coach-recap__chip {
    font-family: var(--v2-mono); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-dim); padding: 7px 13px; border: 1px solid var(--hairline); border-radius: 999px; background: rgba(255,255,255,.045);
  }

  .coach-recap__hero { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: clamp(24px, 4vw, 48px); margin-bottom: clamp(28px, 4vw, 44px); }
  .coach-recap__gauge { position: relative; width: 176px; height: 176px; flex-shrink: 0; }
  .coach-recap__gauge svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .coach-recap__gauge-track { fill: none; stroke: rgba(255,255,255,.08); stroke-width: 10; }
  .coach-recap__gauge-fill { fill: none; stroke-width: 10; stroke-linecap: round; }
  .coach-recap__gauge-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .coach-recap__score { font-family: var(--num); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 68px; line-height: .9; color: var(--q-neutral); }
  .coach-recap__gauge-unit { font-family: var(--v2-mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .08em; margin-top: -2px; }
  .coach-recap__gauge-cap { font-family: var(--v2-mono); font-size: 10px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-dim); margin-top: 5px; }

  .coach-recap__title { font-family: var(--num); font-weight: 700; font-size: clamp(46px, 8vw, 76px); line-height: .92; letter-spacing: -.01em; margin: 0 0 12px; text-wrap: balance; }
  .coach-recap__sub { font-size: clamp(15px, 1.6vw, 17px); line-height: 1.55; color: var(--ink-dim); margin: 0; max-width: 42ch; }
  .coach-recap__sub b { color: var(--q-neutral); font-weight: 600; }

  .coach-recap__reps { border-top: 1px solid var(--hairline); padding-top: 22px; margin-bottom: clamp(26px, 4vw, 40px); }
  .coach-recap__reps-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .coach-recap__legend { display: flex; gap: 18px; flex-wrap: wrap; }
  .coach-recap__legend-item { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-dim); }
  .coach-recap__legend-sw { width: 9px; height: 9px; border-radius: 2px; }
  .coach-recap__stacked { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: rgba(255,255,255,.08); }
  .coach-recap__stacked > div { min-width: 3px; transition: flex-grow .4s ease; }

  .coach-recap__grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 34px 0 clamp(26px, 4vw, 40px); }
  .coach-recap__tile { background: rgba(255,255,255,.045); border: 1px solid var(--hairline); border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 118px; }
  .coach-recap__tile-val { display: flex; align-items: baseline; gap: 5px; }
  .coach-recap__tile-num { font-family: var(--num); font-weight: 700; font-size: 46px; line-height: .85; color: var(--q-neutral); font-variant-numeric: tabular-nums; }
  .coach-recap__tile-unit { font-family: var(--v2-mono); font-size: 12px; color: var(--ink-faint); }
  .coach-recap__tile-foot { font-size: 12.5px; color: var(--ink-faint); margin-top: auto; }

  .coach-recap__focus { display: flex; gap: 16px; align-items: flex-start; border-radius: 16px; padding: 20px 22px; margin-bottom: clamp(28px, 4vw, 40px);
    background: linear-gradient(180deg, rgba(255,176,46,.09), rgba(255,176,46,.03)); border: 1px solid rgba(255,176,46,.30); }
  .coach-recap__focus--clean { background: linear-gradient(180deg, rgba(53,217,138,.09), rgba(53,217,138,.03)); border-color: rgba(53,217,138,.30); }
  .coach-recap__focus-icon { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; background: var(--q-amber); color: #1a1204; display: grid; place-items: center; font-family: var(--num); font-weight: 700; font-size: 26px; line-height: 1; }
  .coach-recap__focus--clean .coach-recap__focus-icon { background: var(--q-green); color: #06180F; }
  .coach-recap__focus-theme { font-size: 19px; font-weight: 600; color: var(--q-neutral); margin: 2px 0 5px; }
  .coach-recap__focus-hint { font-size: 14.5px; line-height: 1.5; color: var(--ink-dim); max-width: 62ch; }
  .coach-recap__focus-list { display: flex; flex-direction: column; gap: 12px; }
  .coach-recap__focus-list .coach-recap__focus { margin-bottom: 0; }

  .coach-recap__cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .coach-recap__btn { font-family: var(--ui); font-size: 15.5px; font-weight: 700; border-radius: 13px; padding: 15px 28px; border: 1px solid transparent; cursor: pointer; transition: transform .14s, background .18s, border-color .18s; }
  .coach-recap__btn:active { transform: scale(.98); }
  .coach-recap__btn--primary { background: var(--q-green); color: #06180F; flex: 1; min-width: 200px; }
  .coach-recap__btn--primary:hover { background: #46e79a; }
  .coach-recap__btn--ghost { background: transparent; color: var(--ink-dim); border-color: rgba(255,255,255,.16); }
  .coach-recap__btn--ghost:hover { color: var(--q-neutral); border-color: var(--ink-faint); background: rgba(255,255,255,.045); }
  .coach-recap__btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  @media (max-width: 620px) {
    .coach-recap__hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
    .coach-recap__sub { margin-inline: auto; }
    .coach-recap__grid { grid-template-columns: repeat(2, 1fr); }
    .coach-recap__btn--primary { flex: 1 1 100%; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .coach-recap__gauge-fill { transition: stroke-dashoffset 1.1s cubic-bezier(.22,.9,.24,1) .15s; }
    .coach-recap__reveal { opacity: 0; transform: translateY(10px); animation: recapReveal .6s cubic-bezier(.22,.9,.24,1) forwards; }
  }
  @keyframes recapReveal { to { opacity: 1; transform: none; } }

  .coach-camera-gate { z-index: 20; background: var(--v2-bg); }
  .coach-camera-gate__inner { width: 460px; text-align: center; }
  .coach-camera-gate__icon {
    width: 60px; height: 60px; margin: 0 auto 20px; display: grid; place-items: center;
    border-radius: 50%; background: var(--v2-card); border: 1px solid var(--v2-line2);
  }
  .coach-camera-gate__title {
    font-family: var(--v2-disp); font-weight: 700; font-size: 30px;
    letter-spacing: -.025em; color: var(--v2-ink);
  }
  .coach-camera-gate__body { margin: 11px 0 24px; color: var(--v2-mute); font-size: 14px; line-height: 1.55; }
  .coach-camera-gate__button {
    height: 48px; padding: 0 25px; border: 0; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--v2-ink); color: #0D0E10;
    font-family: var(--v2-body); font-size: 14px; font-weight: 650;
    transition: transform .14s, background .16s;
  }
  .coach-camera-gate__button:hover { background: #fff; transform: translateY(-1px); }

  .coach-live-screen__scrim {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background:
      linear-gradient(90deg, rgba(4,5,6,.58), transparent 19%, transparent 81%, rgba(4,5,6,.54)),
      linear-gradient(180deg, rgba(4,5,6,.36), transparent 19%, transparent 73%, rgba(4,5,6,.5));
  }
  .coach-live-screen__top-left {
    position: absolute; z-index: 20; top: 18px; left: 26px;
    display: flex; align-items: center; gap: 13px;
  }
  .coach-exercise-brief {
    min-height: 52px; padding: 7px 16px 7px 8px; border-radius: 999px;
    display: flex; align-items: center; gap: 11px;
    background: rgba(13,14,16,.58); border: 1px solid rgba(255,255,255,.15);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .coach-exercise-brief__icon {
    width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center;
    color: var(--v2-ink); background: rgba(255,255,255,.09);
  }
  .coach-exercise-brief__name { color: var(--v2-ink); font-family: var(--v2-disp); font-size: 14px; font-weight: 700; letter-spacing: -.015em; }
  .coach-exercise-brief__meta { margin-top: 2px; color: var(--ink-dim); font-family: var(--v2-mono); font-size: 9px; letter-spacing: .03em; }

  @media (prefers-reduced-motion: reduce) {
    .coach-guide__progress > div { transition: none !important; }
  }

  /* ============================================================================
     MOBILE PASS — appended last so it wins the cascade over the desktop rules
     above (all equal-specificity single/double-class selectors). Everything here
     is gated on max-width:640px, (orientation:portrait) and (pointer:coarse), or
     is visually inert on a desktop mouse pointer — desktop stays pixel-identical.
     ============================================================================ */

  /* 1a. Base / iOS hygiene (unconditional but desktop-inert) */
  html, body { height: 100dvh; }                 /* tracks iOS URL-bar collapse; == 100% on desktop */
  button, a { -webkit-tap-highlight-color: transparent; }
  .v2-hmain, .v2-scroll, .v2-obc, .coach-recap, .v2-cart__list {
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }

  /* 1c. Rotate-to-landscape guard for the live coach (portrait touch only) */
  .coach-rotate { display: none; }
  @media (orientation: portrait) and (pointer: coarse) {
    .coach-rotate {
      display: flex; position: fixed; inset: 0; z-index: 200;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background:
        radial-gradient(900px 500px at 50% 8%, rgba(91,124,255,0.14), transparent 60%),
        var(--v2-bg);
      color: var(--v2-ink); text-align: center; padding: 32px;
      font-family: var(--v2-body);
    }
  }
  .coach-rotate__icon { color: var(--v2-ink); opacity: .9; }
  .coach-rotate__title {
    font-family: var(--v2-disp); font-weight: 700; font-size: 24px;
    letter-spacing: -.02em; margin: 0;
  }
  .coach-rotate__body {
    font-size: 14.5px; line-height: 1.5; color: var(--v2-mute);
    max-width: 280px; margin: 0;
  }

  /* 1b. Phone breakpoint — layout reflow for the six non-Stage screens */
  @media (max-width: 640px) {

    /* --- Hub shell (shared by ModeSelect + SoloWorkspace) --- */
    .v2-htop {
      grid-template-columns: 1fr auto;
      margin: 12px 12px 0; padding: 0 8px 0 4px; height: 54px;
    }
    .v2-htop__brand { display: none; }
    .v2-htop__nav {
      justify-self: start; max-width: 100%;
      overflow-x: auto; scrollbar-width: none;
    }
    .v2-htop__nav::-webkit-scrollbar { display: none; }
    .v2-hnavitem { white-space: nowrap; }
    .v2-hmain { padding: 18px 16px calc(28px + env(safe-area-inset-bottom)); }
    .v2-hwelcome { font-size: clamp(30px, 9vw, 38px); }
    .v2-hgrid2, .v2-hgrid3 { grid-template-columns: 1fr; }
    .v2-heatgrid { justify-content: flex-start; }

    /* --- SoloWorkspace: stack cart below browse, unstick, touch targets --- */
    .v2-lib { grid-template-columns: 1fr; gap: 18px; }
    .v2-cart { position: static; max-height: none; }
    .v2-cart__foot { position: sticky; bottom: 0; background: var(--v2-card); }
    .v2-goals { grid-template-columns: 1fr; }
    .v2-goalpanel { display: none; }
    .v2-progbar { flex-wrap: wrap; }
    .v2-reco__head { flex-wrap: wrap; gap: 10px; }
    .v2-cartcfg { flex-wrap: wrap; }
    .v2-libchip { min-height: 40px; }
    .v2-step__btn, .v2-cartitem__rm, .v2-cartitem__mv { min-width: 34px; min-height: 34px; }

    /* --- Onboarding: single column, 16px inputs (no iOS zoom-on-focus) --- */
    .v2-grid { grid-template-columns: 1fr; gap: 10px; }
    .v2-input, .v2-select, .v2-date__seg, .fs-input { font-size: 16px; }
    .v2-obc { padding-bottom: env(safe-area-inset-bottom); }
    .v2-obc__title { font-size: clamp(30px, 8.5vw, 38px); }
    .v2-obc__actions { flex-direction: column-reverse; }
    .v2-obc__actions .v2-btn { width: 100%; }

    /* --- ReturningUser --- */
    .v2-ru__inner { padding: 0 20px; }
    .v2-ru .v2-h1 { font-size: clamp(38px, 11vw, 56px); }
    .v2-pcard { width: 140px; }
    .v2-ru__cta { flex-wrap: wrap; justify-content: center; }

    /* --- Landing --- */
    .v2-intro__word { font-size: clamp(44px, 13vw, 60px); }
    .v2-pitch__h { font-size: clamp(40px, 11vw, 60px); }
    .v2-pitch__cta { flex-direction: column; width: min(320px, 86vw); }
    .v2-pitch__cta .v2-btn { width: 100%; }

    /* --- Coach recap (F5) safe-area --- */
    .coach-recap { padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
  }
</style>
