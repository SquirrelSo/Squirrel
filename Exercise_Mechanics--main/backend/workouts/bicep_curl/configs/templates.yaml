# Double-arm bicep curl template definitions and scorer/timeline configuration. `active_phases`
# controls live monitoring/cues; `scoring.evidence_phases` independently controls form-score
# evidence. Activation lives exclusively in switches.yaml so an inactive template cannot affect
# cues or form score.
schema_version: 1

scoring:
  version: 4
  min_active_ms: 250
  min_active_frames: 5
  max_frame_delta_ms: 100
  # The tracking-gap boundary scales with the observed frame interval so slow phone cameras
  # (10-15 fps) are not mistaken for lost tracking: tolerance_frames x median interval, never
  # below max_frame_delta_ms (unchanged at ~30 fps) and never above max_gap_ms.
  frame_cadence:
    tolerance_frames: 3
    max_gap_ms: 400
  cue_min_display_ms: 800

templates:
  # Development rule 1/5. Each elbow's outward movement from the torso centre is measured in a
  # body-local front-view axis, normalized by the SET baseline shoulder width, and compared with
  # that arm's own captured resting offset. The fixed torso anchor and denominator prevent shoulder
  # narrowing from inflating this rule and keep shoulder elevation as a separate fault.
  #
  # Bands tuned on labelled rig session 20260720T101346 (rep 1 clean, reps 2-3 deliberate one-sided
  # flare), checked against every other 2026-07-20 capture. Non-flare envelope over 2266 frames
  # spanning clean, lean AND shrug reps: median 0.024, p99 0.102, max 0.1056.
  #   fault 0.25 (previous) -> flare reps 1735/2308 ms
  #   fault 0.15 (current)  -> flare reps 2704/3330 ms, every non-flare rep still 0 ms
  # The looser 0.25 caught the flare but only its peaks; 0.15 catches ~50% more of the same flare
  # with no new false frames.
  #
  # DO NOT DROP THE SAFE BOUNDARY BELOW 0.12. The floor is set by LEAN CONTAMINATION, not padding.
  # A lateral torso lean rotates the torso frame while the arm hangs from gravity, so the elbow
  # genuinely sits further from the torso centre without the elbow having moved. Session
  # 20260720T094748 (leans, no flare) reads up to 0.1056 of pure lean-induced flare, r=+0.371
  # between |lean angle| and flare over 859 frames. At 0.10 that rep fires 950 ms of false flare.
  # If the lateral_torso_lean bands are ever tightened, that ceiling drops and this floor can follow.
  #
  # KNOWN, UNCORRECTED: the signal drifts ~+0.05 as the wrists rise, measured on CLEAN reps
  # (20260720T075809 s1: 0.001 arms-down -> 0.048 arms-up). Same class of curl-height confound that
  # took three rounds to find in shoulder_elevation. It is inside the non-flare envelope above and
  # so is already covered by these bands, but a future tightening must subtract it first rather than
  # absorb it into the threshold.
  #
  # Front-view scope limit: this sees only the LATERAL half of "elbow flare". The commoner cheat is
  # the elbow drifting FORWARD, which is a depth change, and MediaPipe z is unusable here. A passing
  # flare score does not mean the elbows stayed put.
  #
  # Still `development`: one person, one session, one flare style.
  - id: elbow_flare_corridor
    rank: 1
    tier: high
    tuning_status: development
    fault_label: "Elbow flare"
    active_phases: [ascent, top, descent]
    required_keypoints: [left_shoulder, right_shoulder, left_elbow, right_elbow, left_hip, right_hip]
    issue: "An elbow moves outside its stable baseline corridor during the curl."
    cue: "Keep your elbows close to your sides."
    coaching: "Your elbow drifted away from your torso during the curl. Keep your upper arm quiet and your elbow close to your side, then move the weight by bending at the elbow."
    min_shoulder_width_px: 30
    min_torso_length_px: 50
    policy:
      mode: baseline_relative_elbow_outward_offset
      ranges:
        - range: {lte: 0.12}
          state: safe
          skeleton_color: green
        - range: {gt: 0.12, lte: 0.15}
          state: warning
          skeleton_color: green
        - range: {gt: 0.15}
          state: not_ok
          skeleton_color: red
    scoring:
      role: penalty
      weight: 0.50
      confirmed_fault:
        min_not_ok_ms: 250
        minimum_penalty: 0.30
      evidence_phases: [ascent, top, descent]

  # Development rule 2/5. Exercise-local copy of the squat front-view geometry: baseline ankles
  # establish anatomical left/right, shoulder midpoint relative to hip midpoint gives the torso
  # angle, and the captured baseline angle is subtracted to preserve natural stance and camera roll.
  # Existing curl sessions 20260718T123000 and 20260718T124520 stay within ±1.07°, comfortably
  # inside the ±3° safe corridor. Keep development until deliberate left/right lean reps confirm the
  # copied ±3°/±5° bands for curls.
  - id: lateral_torso_lean
    rank: 3
    tier: high
    tuning_status: development
    fault_label: "Lateral torso lean"
    active_phases: [ascent, top, descent]
    # LIVE keypoints only; this list is drift-guarded against the module's REQUIRED_KEYPOINTS.
    # Ankles are needed at BASELINE construction (they orient anatomical left) but never live, so
    # the feet leaving frame mid-set no longer takes the rule offline. They stay in setup.yaml
    # because the stance pre-check requires them there.
    required_keypoints: [left_shoulder, right_shoulder, left_hip, right_hip]
    issue: "The torso leans sideways instead of remaining upright over the hips."
    cue: "Keep your torso upright and centered."
    coaching: "You were tipping to one side through the curl. Brace your core and keep your shoulders stacked over your hips so the arm moves the weight without your torso shifting sideways."
    # Plausibility floor on the live hip-to-shoulder line. The reported angle is that line's
    # DIRECTION, so its noise scales inversely with its length: 1px of landmark jitter is worth
    # 0.34 deg across a healthy 170px torso but 26 deg across a 2px one. Below this, a degraded
    # frame would publish a fault-sized lean built entirely from noise, so the rule abstains.
    # Matches the floor used by shoulder_elevation and elbow_flare_corridor.
    min_torso_length_px: 50
    policy:
      mode: baseline_relative_angle
      ranges:
        - range: {lt: -5.0}
          state: not_ok
          side: right
          skeleton_color: red
        - range: {gte: -5.0, lt: -3.0}
          state: warning
          side: right
          skeleton_color: green
        - range: {gte: -3.0, lte: 3.0}
          state: safe
          side: null
          skeleton_color: green
        - range: {gt: 3.0, lte: 5.0}
          state: warning
          side: left
          skeleton_color: green
        - range: {gt: 5.0}
          state: not_ok
          side: left
          skeleton_color: red
    scoring:
      role: penalty
      weight: 0.30
      evidence_phases: [ascent, top, descent]

  # Development rule 3/5. Vertical shoulder rise against the set baseline, in the torso's own frame,
  # normalized by the BASELINE shoulder width and corrected for the tracker's curl-height distortion.
  # Full derivation in rules/shoulder_elevation.py; the short version:
  #
  #   * The tracker lifts the shoulder landmark as the wrists rise, smoothly and by as much as a real
  #     shrug, at visibility 1.00. `curl_height_slope` subtracts that expected lift. It is anchored at
  #     the person's OWN baseline curl height, so no per-person intercept is needed and body size
  #     enters only through that baseline - this is what makes one constant serve every build.
  #   * The denominator is the baseline width, never the live width. Clean reps narrow the apparent
  #     shoulders ~8.4% at the top; a deliberate shrug adds only ~3%. A live denominator measures the
  #     curl, not the shrug (see the module docstring for the numbers that killed that variant).
  #
  # Tuned on labelled session 20260720T071533 - set 1 three clean reps, set 2 three elevated reps,
  # same person, same camera. Slope fitted on clean reps 1-2 only; rep 3 held out and still clean.
  # At slope 0.040 / fault 0.05:  clean 0/0/0 ms      elevated 2501/3236/3900 ms
  # Zero false frames hold across slopes 0.035-0.053, so a +/-40% error in the constant still cannot
  # produce a false positive; the 250 ms confirmation window is the second line of defence.
  #
  # NOT YET PERSON-INDEPENDENT: one body, one session. The slope is assumed to be the tracker's
  # behaviour rather than this person's, and that is UNVERIFIED. Run the same clean/elevated protocol
  # on 2-3 different builds and compare slopes before promoting past `development`.
  #
  # Capture the baseline with the shoulders deliberately relaxed and DOWN. Sessions 20260718T123000
  # and 20260718T124520 were captured with them hiked, which made a real shrug measure only +2.3px of
  # rise and sent an entire tuning round chasing a width-ratio signal. Those sessions are void.
  - id: shoulder_elevation
    rank: 4
    tier: medium
    tuning_status: development
    fault_label: "Shoulder shrug"
    active_phases: [ascent, top, descent]
    required_keypoints: [left_shoulder, right_shoulder, left_hip, right_hip, left_wrist, right_wrist]
    issue: "A shoulder rises above its stable baseline position during the curl."
    cue: "Keep your shoulders down and relaxed."
    coaching: "Your shoulder lifted to help the curl. Keep both shoulders down and stable, then move the weight by bending at the elbow instead of shrugging it upward."
    min_shoulder_width_px: 30
    min_torso_length_px: 50
    # Expected shoulder lift per unit of curl height, subtracted before judging.
    curl_height_slope: 0.040
    policy:
      mode: baseline_relative_rise_curl_corrected
      ranges:
        - range: {lte: 0.04}
          state: safe
          skeleton_color: green
        - range: {gt: 0.04, lte: 0.05}
          state: warning
          skeleton_color: green
        - range: {gt: 0.05}
          state: not_ok
          skeleton_color: red
    scoring:
      role: penalty
      weight: 0.20
      confirmed_fault:
        min_not_ok_ms: 250
        minimum_penalty: 0.10
      evidence_phases: [ascent, top, descent]

  # Range-of-motion authority. One dual-arm template reads BOTH arms every frame and exposes each
  # arm's normalized wrist rise; the weaker arm (min of the two) drives rep progress and the
  # full-versus-shallow verdict, so a rep only qualifies as full when both arms reach the gate.
  #   wrist_h  = projection(wrist - live_hip_midpoint, live_body_up_axis)
  #   offset   = (baseline_shoulder_h - wrist_h) / baseline_upper_arm
  #   progress = (baseline_offset - offset) / (baseline_offset - target_offset)
  # The 2D elbow angle this replaced collapses under front-view foreshortening and cannot separate
  # a shallow curl from a full one; vertical wrist travel reads cleanly on a front camera.
  - id: curl_rom
    rank: 2
    tier: high
    # The 0.75 gate separated two earlier labelled full/shallow sessions, but the signal anchor was
    # changed from the live shoulder to the captured shoulder target to prevent shrug double-counting.
    # Keep development until the same labelled protocol confirms the gate on the corrected signal.
    tuning_status: development
    fault_label: "Short curl"
    active_phases: [ascent, top, descent]
    # Shoulders only: elbows and wrists are optional (either arm curling counts) and the hips are not
    # used, so curling close to the camera with the hips out of frame still counts (rules/curl_rom.py).
    required_keypoints: [left_shoulder, right_shoulder]
    issue: "The curl does not reach the intended flexion at the top."
    cue: "Curl all the way up with control."
    coaching: "You're cutting your curls short. Squeeze the weight all the way up until your forearm nearly meets your biceps, pause at the top, then lower under control — the full range is where the muscle is built."
    # Normalized wrist offset that counts as a complete curl: 0.0 = wrist level with the shoulder.
    target_offset: 0.0
    # Plausibility floor on the shoulder→elbow span, in pixels, for both the baseline and live
    # frames; below it the person is turned away or the joints have collapsed and the ratio is noise.
    min_upper_arm_px: 30
    full_rom_gate: 0.75
    shallow_next_rep_cue_ms: 500
    # The planned curl (session variant), said when the arms do not match it: a single-arm set in
    # which both arms curl together, or a double-arm set in which one arm stays down.
    variant_cues:
      single: "Single-arm curl: curl one arm at a time."
      double: "Curl with both arms together."
    scoring:
      role: rom
      mode: rom
      rom_floor: 0.30
      evidence_phases: [ascent, top, descent]

  # Setup-only stance monitor, reused verbatim from squat (shared policy across exercises).
  - id: stance_width
    rank: 6
    tier: low
    tuning_status: ready
    fault_label: "Stance too narrow / too wide"
    active_phases: [setup]
    required_keypoints: [left_ankle, right_ankle, left_shoulder, right_shoulder]
    issue: "The feet are outside the configured stable stance range."
    cue: "Stand shoulder-width with stable feet."
    min_shoulder_px: 10
    policy:
      ranges:
        - range: {lt: 0.70}
          state: not_ok
          skeleton_color: red
        - range: {gte: 0.70, lt: 0.80}
          state: warning
          skeleton_color: green
        - range: {gte: 0.80, lte: 1.20}
          state: safe
          skeleton_color: green
        - range: {gt: 1.20, lte: 1.30}
          state: warning
          skeleton_color: green
        - range: {gt: 1.30}
          state: not_ok
          skeleton_color: red
    scoring:
      role: monitor

  # Setup-only pre-check: both arms must hang extended before the timer + baseline start. The curl
  # analog of squat's standing_posture. Never live-scored.
  - id: arms_extended
    rank: 7
    tier: pre_check
    tuning_status: ready
    fault_label: "Extend your arms"
    active_phases: [setup]
    required_keypoints: [left_shoulder, right_shoulder, left_elbow, right_elbow, left_wrist, right_wrist]
    issue: "The curl baseline must be captured with both arms hanging extended at your sides."
    cue: "Straighten both arms fully by your sides."
    setup_policy:
      min_elbow_extension_deg: 150
