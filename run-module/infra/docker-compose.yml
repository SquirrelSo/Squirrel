services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: run_module_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: run_module
    ports:
      # Host port is 5434 (not 5432/5433) because this machine has native
      # PostgreSQL 17 on 5432 and PostgreSQL 18 on 5433. Port 5434 is
      # confirmed free. The container-side port is unchanged at 5432.
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d run_module"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: run_module_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
